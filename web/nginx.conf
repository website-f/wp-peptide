server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 16m;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

  # Note: nginx drops server-level add_header in any location that sets its own,
  # so the security headers are repeated wherever a location adds Cache-Control.
  set $sec_nosniff "nosniff";

  location /api/ {
    proxy_pass http://api:8601;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # The API already sends immutable caching for uploads (names are unique per file).
  location /uploads/ {
    proxy_pass http://api:8601;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options $sec_nosniff always;
  }

  # Hashed bundles and image renditions never change in place.
  location ~* ^/(assets|img|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options $sec_nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }
}
