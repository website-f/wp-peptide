# Top-level routes of the shop app (web/src/App.tsx). Add new ones here, or they answer 404.
map $uri $spa_route {
  default 0;
  ~^/$ 1;
  ~^/index\.html$ 1;
  ~^/(shop|checkout|order|build-a-box|bulk|coa-library|membership|points|contact|about|faq|partners|login|register|forgot-password|reset-password|account|policies|admin|bmi-calculator)(/|$) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 16m;
  server_tokens off;
  # Relative Location headers: redirects stay on the public scheme/host/port the proxy received.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

  # Note: nginx drops server-level add_header in any location that sets its own,
  # so the security headers are repeated wherever a location adds Cache-Control.
  set $sec_nosniff "nosniff";

  # ---------- Mail (kyvo-mail stack, joined through the "kyvo-mail" docker network) ----------
  # Resolved per request, so the store still starts when the mail stack is not running.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # mail.<domain> is the mail server's own name (MX / IMAP / SMTP). In a browser it goes to webmail.
  # 404 and 410 pages are the shop app itself (it shows "page not found"), with the real status code.
  error_page 404 410 /index.html;

  # Search engines: generated by the API from the live catalogue.
  location = /robots.txt {
    proxy_pass http://api:8601;
    proxy_set_header Host $host;
  }
  location = /sitemap.xml {
    proxy_pass http://api:8601;
    proxy_set_header Host $host;
  }

  # This domain used to run WordPress (a demo shop and a "Hello world" post). Those addresses
  # are gone for good: 410 makes search engines drop them instead of keeping the old results.
  location ~* "^/(wp-|wordpress|xmlrpc\.php|feed/?$|comments/feed|sample-page|hello-world|category/|tag/|author/|product/|product-category/|product-tag/|my-account|cart/?$|shop/page/|page/[0-9]+|[0-9]{4}/[0-9]{2}(/|$))" {
    return 410;
  }

  location = / {
    if ($host ~* ^mail\.) { return 302 /webmail/; }
    # Old WordPress links like /?p=1, /?page_id=2, /?s=..., /?add-to-cart=...
    if ($args ~* "(^|&)(p|page_id|cat|tag|author|s|post_type|add-to-cart|product)=") { return 410; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files /index.html =404;
  }

  # cPanel-style control panel: email accounts, forwarders, delivery log, DNS check.
  location = /mail { return 301 /mail/; }
  location /mail/ {
    set $mail_panel http://kyvo-mail-panel:3000;
    proxy_pass $mail_panel;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Roundcube webmail.
  location = /webmail { return 301 /webmail/; }
  location /webmail/ {
    client_max_body_size 30m;
    set $webmail http://kyvo-roundcube:80;
    rewrite ^/webmail/(.*)$ /$1 break;
    proxy_pass $webmail;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /api/ {
    proxy_pass http://api:8601;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # The API already sends immutable caching for uploads (names are unique per file).
  location /uploads/ {
    proxy_pass http://api:8601;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options $sec_nosniff always;
  }

  # Hashed bundles and image renditions never change in place.
  location ~* ^/(assets|img|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options $sec_nosniff always;
    try_files $uri =404;
  }

  # Certificate page images. Not immutable: re-running scripts/optimize-coas.mjs rewrites them in place.
  location /coa/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options $sec_nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ @spa;
  }

  # Known app routes get the app (200); unknown paths get it too, but with a 404 status.
  location @spa {
    if ($spa_route = 0) { return 404; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $sec_nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    rewrite ^ /index.html break;
  }
}
